name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hdverse
          POSTGRES_PASSWORD: hdverse_test
          POSTGRES_DB: hdverse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate --schema=src/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://hdverse:hdverse_test@localhost:5432/hdverse_test

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check Web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build API
        working-directory: apps/api
        run: npm run build
        env:
          DATABASE_URL: postgresql://hdverse:hdverse_test@localhost:5432/hdverse_test

      - name: Build Web
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001
